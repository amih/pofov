# /etc/nginx/sites-available/<host> — replace HOST, APP_DIR. certbot adds TLS.
upstream pofov_api {
    server 127.0.0.1:3870;
    keepalive 16;
}

server {
    server_name HOST;
    root APP_DIR/web/dist;
    client_max_body_size 20M;

    # Content-hashed files never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything that decides which version runs must always be revalidated.
    location = /sw.js               { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /version.json        { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { application/manifest+json webmanifest; } try_files $uri =404; }

    # Uploaded photos have unique names.
    location /uploads/ {
        alias APP_DIR/uploads/;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff;
    }

    location /api/ {
        proxy_pass http://pofov_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App routes (/l/ABC123, /add, …) → index.html, never cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    listen 80;
}
